<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物资领用工作流</title>
<style>body{font-family:system-ui;margin:0;background:#f4f6fb;color:#16213a}.wrap{max-width:1050px;margin:auto;padding:36px}.hero{display:flex;justify-content:space-between;align-items:center}.badge{background:#dfe8ff;color:#224ca8;padding:7px 12px;border-radius:20px}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px}.card{background:white;border:1px solid #dce1eb;border-radius:14px;padding:20px;box-shadow:0 8px 24px #1725540d}label{display:block;margin:12px 0 5px}input,select,button{width:100%;padding:10px;box-sizing:border-box;border:1px solid #bcc5d6;border-radius:8px}button{margin-top:18px;background:#2457d6;color:white;font-weight:700;border:0;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;font-size:14px}.ok{color:#137333}.bad{color:#b42318}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="hero"><div><h1>物资领用工作流</h1><p>请求校验 → Node-RED 编排 → SQLite 库存事务</p></div><span class="badge">规则版本 2026.1</span></div><div class="grid"><section class="card"><h2>提交申请</h2><form id="form"><label>请求编号</label><input id="request" required><label>商品</label><select id="sku"></select><label>数量</label><input id="quantity" type="number" min="1" value="1" required><button>提交订单</button></form><p id="result"></p></section><section class="card"><h2>处理记录</h2><label>状态筛选</label><select id="filter"><option value="">全部</option><option>completed</option><option>rejected</option></select><table><thead><tr><th>编号</th><th>SKU</th><th>数量</th><th>状态</th><th>原因</th></tr></thead><tbody id="rows"></tbody></table></section></div></div>
<script>const $=s=>document.querySelector(s); async function load(){const p=await fetch('/api/products').then(r=>r.json());$('#sku').innerHTML=p.items.map(x=>`<option value="${x.sku}">${x.name} · 库存 ${x.stock} · 上限 ${x.max_per_request}</option>`).join('');const f=$('#filter').value;const d=await fetch('/api/orders'+(f?'?status='+encodeURIComponent(f):'')).then(r=>r.json());$('#rows').innerHTML=d.items.map(x=>`<tr><td><a href="/api/orders/${encodeURIComponent(x.request_id)}" target="_blank">${x.request_id}</a></td><td>${x.sku}</td><td>${x.quantity}</td><td class="${x.status==='completed'?'ok':'bad'}">${x.status}</td><td>${x.reason||'-'}</td></tr>`).join('')}$('#request').value='s2026-'+Date.now().toString().slice(-6);$('#form').onsubmit=async e=>{e.preventDefault();const b={request_id:$('#request').value,sku:$('#sku').value,quantity:Number($('#quantity').value)};const r=await fetch('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const d=await r.json();$('#result').className=r.ok?'ok':'bad';$('#result').textContent=(r.ok?'处理成功：':'处理失败：')+JSON.stringify(d);await load()};$('#filter').onchange=load;load();</script></body></html>
